<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MOSSlight — explore</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f1418; color: #cfd6d2; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 10px 16px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #222a30; flex-wrap: wrap; }
  header b { color: #e6ead9; letter-spacing: .04em; }
  button, select, input[type=range] { background: #1b2328; color: #cfd6d2; border: 1px solid #2d3840; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button.on { background: #2f4a3a; border-color: #4f7a5a; color: #eef5e8; }
  main { flex: 1; overflow: auto; display: grid; place-items: start center; padding: 12px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  .hint { opacity: .6; } #clock { min-width: 15ch; color: #e6ead9; }
  .presets button { padding: 2px 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>MOSSlight · explore</b>
  <span id="clock"></span>
  <button id="play" class="on">pause</button>
  <label>speed <select id="speed"><option>60</option><option selected>240</option><option>900</option><option>3600</option></select>×</label>
  <label>time <input type="range" id="time" min="0" max="1439" value="780" style="width:180px"></label>
  <label>season <select id="season"><option>spring</option><option>summer</option><option>autumn</option><option>winter</option></select></label>
  <label>weather <select id="weather"><option>clear</option><option>light_rain</option><option>heavy_rain</option><option>fog</option><option>snow</option><option>wind</option></select></label>
  <label>intensity <input type="range" id="intensity" min="0" max="100" value="70" style="width:90px"></label>
  <label>event <select id="event"><option value="">none</option></select></label>
  <label>zoom <select id="zoom"><option>1</option><option>2</option><option selected>3</option></select></label>
  <label><input type="checkbox" id="viewport" checked> 640×360 viewport</label>
  <label>screen <select id="aspect"><option value="640x360">16:9 (640×360)</option><option value="780x360">19.5:9 phone (780×360)</option><option value="720x360">20:10 (720×360)</option><option value="480x360">4:3 (480×360)</option></select></label>
  <label>safe inset <input type="range" id="safe" min="0" max="40" value="0" style="width:60px"></label>
  <label><input type="checkbox" id="touch"> touch controls</label>
  <label>cam smooth <input type="range" id="camsmooth" min="1" max="20" value="8" style="width:70px"></label>
  <span class="presets" id="presets"></span>
  <span id="dev" class="presets" style="display:none"></span>
  <label><input type="checkbox" id="devtoggle"> dev tools</label>
  <span class="hint">WASD move · E interact · I pack · J field guide · 1-4 tools · space pause · [ ] time</span>
</header>
<main><canvas id="c"></canvas></main>
<script src="survival.js"></script>
<script src="gather.js"></script>
<script>
// ---------------------------------------------------------------- modules
// WorldClock: game time, configurable scale, pause/advance.  (mirrors godot/WorldClock.gd)
const WorldClock = {
  minutes: 780, scale: 240, paused: false, _acc: 0,
  tick(dtReal) { if (!this.paused) this.minutes = (this.minutes + dtReal * this.scale / 60) % 1440; },
  hour() { return this.minutes / 60; },
  label() { const h = Math.floor(this.minutes / 60), m = Math.floor(this.minutes % 60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; },
  phase(season) { const kf = DATA.keyframes[season]; const h = this.hour(); let name = 'night';
    for (let k = 0; k < kf.hours.length; k++) { if (h >= kf.hours[k]) name = kf.names[k]; } return name; },
};
// SeasonState / WeatherState: current values + eased transitions.
const SeasonState = { season: 'spring' };
const WeatherState = { kind: 'clear', target: 0.7, intensity: 0.0, prevKind: 'clear', prevIntensity: 0.0, wind: 0.0, windTarget: 0.0,
  set(kind, target) { if (kind !== this.kind) { this.prevKind = this.kind; this.prevIntensity = this.intensity; this.intensity = 0; } this.kind = kind; this.target = target; },
  tick(dt) { // weather eases in over ~6 s, the previous weather eases out
    this.intensity += (this.target - this.intensity) * Math.min(1, dt * 0.35);
    this.prevIntensity += (0 - this.prevIntensity) * Math.min(1, dt * 0.5);
    const w = { clear: 0.08, light_rain: 0.35, heavy_rain: 0.7, fog: 0.05, snow: 0.3, wind: 1.0 }[this.kind] * Math.max(0.3, this.target);
    this.windTarget = w; this.wind += (this.windTarget - this.wind) * Math.min(1, dt * 0.3);
  } };
const EventState = { current: null };

// ---------------------------------------------------------------- data
const DATA = { keyframes: {}, entries: null, weather: null, scene: null, idx: {}, night: null, events: {}, play: null, depth: {}, col: null, player: null, pidx: null };
function loadRGB(p) { return new Promise(res => { const im = new Image(); im.onload = () => { const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height; const g = cv.getContext('2d'); g.drawImage(im, 0, 0); res({ w: im.width, h: im.height, d: g.getImageData(0, 0, im.width, im.height).data }); }; im.src = p; }); }
async function loadJSON(p) { return (await fetch(p)).json(); }
function loadIdx(p) { return new Promise(res => { const im = new Image(); im.onload = () => { const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height; const g = cv.getContext('2d'); g.drawImage(im, 0, 0); const d = g.getImageData(0, 0, im.width, im.height).data; const out = new Uint8Array(im.width * im.height); for (let i = 0; i < out.length; i++) out[i] = d[i * 4]; res(out); }; im.src = p; }); }
const A = '../assets/atmosphere/';
async function boot() {
  try { await fetch(A + 'scene.json'); } catch (e) { document.getElementById('clock').textContent = 'needs a local server: run  python3 preview/serve.py  in the project folder, then open http://localhost:8765/preview/world.html'; return; }
  for (const s of ['spring', 'summer', 'autumn', 'winter']) DATA.keyframes[s] = await loadJSON(A + s + '_keyframes.json');
  DATA.entries = await loadJSON(A + 'palette_entries.json'); DATA.weather = await loadJSON(A + 'weather_grades.json'); DATA.scene = await loadJSON(A + 'scene.json');
  for (const s of ['spring', 'summer', 'autumn', 'winter']) DATA.idx[s] = await loadIdx(A + DATA.scene.layers[s]);
  DATA.night = await loadIdx(A + DATA.scene.night_layer);
  DATA.shadow = {}; for (const sn in DATA.scene.shadows) { DATA.shadow[sn] = { noon: await loadIdx(A + DATA.scene.shadows[sn].noon), long: await loadIdx(A + DATA.scene.shadows[sn].long) }; }
  DATA.evlayers = {}; for (const en in DATA.scene.events) { const e = DATA.scene.events[en]; DATA.evlayers[en] = { idx: await loadIdx(A + e.layer), noon: await loadIdx(A + e.noon), long: await loadIdx(A + e.long) }; }
  const PL = '../assets/play/';
  DATA.play = await loadJSON(PL + 'play.json'); DATA.player = await loadJSON(PL + 'player.json');
  for (const k of ['spring', 'winter']) { const r = await loadRGB(PL + 'depth_' + k + '.png'); const d = new Uint16Array(r.w * r.h); for (let i = 0; i < d.length; i++) d[i] = r.d[i * 4] | (r.d[i * 4 + 1] << 8); DATA.depth[k] = d; }
  DATA.col = await loadIdx(PL + 'collision.png');
  DATA.pidx = await loadIdx(PL + 'player_idx.png');
  Player.init();
  DATA.survival = await loadJSON('../assets/survival/config.json');
  Survival.init(DATA.survival, { WorldClock, SeasonState, Player, Interaction, DATA, keyframes: DATA.keyframes });
  const IT = '../assets/items/';
  const gdata = { items: await loadJSON(IT + 'items.json'), tools: await loadJSON(IT + 'tools.json'), nodes: await loadJSON(IT + 'nodes.json'), icons: await loadJSON(IT + 'icons.json'), natlas: await loadJSON(IT + 'nodes_atlas.json') };
  const iconIdx = await loadIdx(IT + 'icons_idx.png'); const nodeIdx = await loadIdx(IT + 'nodes_idx.png');
  DATA.nodeIdx = nodeIdx; DATA.nodeAtlasW = 6 * 28;
  Gather.init(gdata, { Survival, WorldClock, SeasonState, WeatherState, Player, Camera, iconIdx, iconW: gdata.icons.cols * gdata.icons.size });
  Survival.Dev.mount(document.getElementById('dev'));
  if (location.search.includes('dev=1')) { document.getElementById('dev').style.display = ''; document.getElementById('devtoggle').checked = true; }
  WorldClock.paused = false;
  for (const e of ['winter_fishing', 'autumn_gathering', 'summer_pond_evening', 'marsh_night']) { try { DATA.events[e] = await loadJSON('../assets/events/' + e + '.json'); } catch (_) {} }
  const sel = document.getElementById('event'); for (const k in DATA.events) { const o = document.createElement('option'); o.value = k; o.textContent = DATA.events[k].label; sel.appendChild(o); }
  classify(); buildLightMap(); requestAnimationFrame(frame);
}
// per-index class flags: 1 canopy (sways), 2 water (ripples/reflection), 4 emissive, 8 sky
let CLS;
function classify() { const n = DATA.entries.entries.length; CLS = new Uint8Array(n);
  DATA.entries.entries.forEach((e, i) => { let f = 0; if (DATA.entries.canopy.includes(e.family)) f |= 1; if (e.family === 'water') f |= 2; if (DATA.entries.emissive.includes(e.family)) f |= 4; if (DATA.entries.sky.includes(e.family)) f |= 8; if (e.family === 'firefly') f |= 16; CLS[i] = f; }); }

// ---------------------------------------------------------------- lights: static falloff map, per-light flicker
const W = 768, H = 480; let LW, LI, LIGHTS;
function buildLightMap(extra = []) {
  LIGHTS = DATA.scene.lights.concat(extra); LW = new Float32Array(W * H); LI = new Int16Array(W * H).fill(-1);
  const bay = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  LIGHTS.forEach((L, li) => { const r = L.radius; const x0 = Math.max(0, L.x - r | 0), x1 = Math.min(W - 1, L.x + r | 0), y0 = Math.max(0, L.y - r | 0), y1 = Math.min(H - 1, L.y + r | 0);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const d = Math.hypot(x - L.x, (y - L.y) * 1.25) / r; if (d >= 1) continue;
      let w = Math.pow(1 - d, 1.6) * L.intensity; w = Math.min(1, Math.floor(w * 5 + bay[y & 3][x & 3] / 16 * 0.9) / 5); const i = y * W + x; if (w > LW[i]) { LW[i] = w; LI[i] = li; } } });
}
// ---------------------------------------------------------------- palette table for "now"
function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function tableAt(season, hour) { const kf = DATA.keyframes[season]; const hs = kf.hours, n = hs.length;
  for (let k = 0; k < n; k++) { const h0 = hs[k]; const h1 = hs[(k + 1) % n] + (k === n - 1 ? 24 : 0); const hh = hour + ((k === n - 1 && hour < hs[0]) ? 24 : 0);
    if (hh >= h0 && hh <= h1) { let t = (hh - h0) / (h1 - h0); t = t * t * (3 - 2 * t); const a = kf.tables[k], b = kf.tables[(k + 1) % n];
      return { table: a.map((c, i) => lerp3(c, b[i], t)), darkness: kf.darkness[k] * (1 - t) + kf.darkness[(k + 1) % n] * t }; } }
  return { table: kf.tables[n - 1], darkness: 1 }; }
function gradeTable(table, wkind, wi, ev) { // weather + event grades on the 200-entry table, never per pixel
  const g = DATA.weather[wkind]; const out = new Array(table.length);
  for (let i = 0; i < table.length; i++) { let c = table[i]; const em = CLS[i] & 4;
    if (wi > 0 && !em) { const lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; const sat = 1 - (1 - g.sat) * wi; const val = 1 - (1 - g.val) * wi;
      c = [ (lum + (c[0] - lum) * sat) * val + g.lift * wi, (lum + (c[1] - lum) * sat) * val + g.lift * wi, (lum + (c[2] - lum) * sat) * val + g.lift * wi ];
      c = lerp3(c, g.key, g.t * wi); }
    if (ev && ev.grade && !em) { const lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; c = [ (lum + (c[0] - lum) * ev.grade.sat) * ev.grade.val, (lum + (c[1] - lum) * ev.grade.sat) * ev.grade.val, (lum + (c[2] - lum) * ev.grade.sat) * ev.grade.val ]; c = lerp3(c, ev.grade.key, ev.grade.t); }
    out[i] = c; }
  return out; }

// ---------------------------------------------------------------- weather particles
const P = { rain: [], snow: [], leaves: [], splash: [], fire: [], ff: [] };
function rnd(a, b) { return a + Math.random() * (b - a); }
function spawn(kind, n, wind) {
  for (let i = 0; i < n; i++) {
    if (kind === 'rain') P.rain.push({ x: rnd(-60, W + 60), y: rnd(-20, H), v: rnd(260, 380), near: Math.random() < 0.4 });
    if (kind === 'snow') P.snow.push({ x: rnd(-60, W + 60), y: rnd(-20, H), v: rnd(14, 30), ph: rnd(0, 6.28), big: Math.random() < 0.35 });
    if (kind === 'leaves') P.leaves.push({ x: rnd(-40, W), y: rnd(0, H), v: rnd(30, 70), ph: rnd(0, 6.28), life: rnd(2, 6), col: Math.random() < 0.5 ? [196, 120, 60] : [160, 90, 48] });
  }
}
function tickParticles(dt, time) {
  const w = WeatherState, wind = w.wind, wk = w.kind, inten = w.intensity;
  const want = { rain: wk === 'light_rain' ? 70 * inten : wk === 'heavy_rain' ? 260 * inten : 0, snow: wk === 'snow' ? 150 * inten : 0,
                 leaves: (SeasonState.season === 'autumn' && wind > 0.3) ? 18 * wind : 0 };
  for (const k of ['rain', 'snow', 'leaves']) { if (P[k].length < want[k]) spawn(k, Math.min(8, want[k] - P[k].length), wind); }
  const slant = 40 + 160 * wind;
  P.rain = P.rain.filter(p => { p.y += p.v * dt * (p.near ? 1.3 : 0.8); p.x += slant * dt * (p.near ? 1.2 : 0.7);
    if (p.y > H) { if (Math.random() < 0.35 && P.splash.length < 60) P.splash.push({ x: p.x, y: rnd(H * 0.2, H), t: 0 }); return false; } return P.rain.length <= want.rain + 20; });
  P.splash = P.splash.filter(p => { p.t += dt * 6; return p.t < 1; });
  P.snow = P.snow.filter(p => { p.ph += dt * 1.6; p.y += p.v * dt * (p.big ? 1.3 : 1); p.x += (Math.sin(p.ph) * 10 + 18 + 70 * wind) * dt; if (p.y > H + 4 || p.x > W + 60) return false; return P.snow.length <= want.snow + 20; });
  P.leaves = P.leaves.filter(p => { p.ph += dt * 3; p.life -= dt; p.x += (50 + 120 * wind) * dt; p.y += (Math.sin(p.ph) * 18 + p.v * 0.25) * dt; return p.life > 0 && p.x < W + 20; });
  // night: fireflies drift gently; only when dark
}

// ---------------------------------------------------------------- fog field (small noise, nearest-upscaled, Bayer-thresholded)
const FW = 96, FH = 60, FOG = new Float32Array(FW * FH), FOG2 = new Float32Array(FW * FH);
(function () { const r = (x, y, s) => { const n = Math.sin(x * 12.9898 + y * 78.233 + s * 37.1) * 43758.5453; return n - Math.floor(n); };
  const val = (x, y, sc, s) => { const ix = Math.floor(x / sc), iy = Math.floor(y / sc), fx = x / sc - ix, fy = y / sc - iy, sm = t => t * t * (3 - 2 * t);
    const a = r(ix, iy, s), b = r(ix + 1, iy, s), c = r(ix, iy + 1, s), d = r(ix + 1, iy + 1, s); return (a * (1 - sm(fx)) + b * sm(fx)) * (1 - sm(fy)) + (c * (1 - sm(fx)) + d * sm(fx)) * sm(fy); };
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) { FOG[y * FW + x] = 0.6 * val(x, y, 14, 1) + 0.3 * val(x, y, 7, 2) + 0.1 * val(x, y, 3, 3); FOG2[y * FW + x] = 0.7 * val(x + 30, y + 7, 11, 4) + 0.3 * val(x, y, 5, 5); } })();
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];


// ---------------------------------------------------------------- Input abstraction (keyboard + touch -> the same actions)
const Input = {
  keys: {}, touch: { active: false, ax: 0, ay: 0, x: 0, y: 0, id: null }, actionPressed: false, _actionLatch: false,
  axis() { let x = 0, y = 0; const k = this.keys;
    if (k['a'] || k['arrowleft']) x -= 1; if (k['d'] || k['arrowright']) x += 1; if (k['w'] || k['arrowup']) y -= 1; if (k['s'] || k['arrowdown']) y += 1;
    if (this.touch.active) { const dx = (this.touch.x - this.touch.ax) / 28, dy = (this.touch.y - this.touch.ay) / 28; const L = Math.hypot(dx, dy); if (L > 0.15) { x = dx / Math.max(1, L); y = dy / Math.max(1, L); } }
    const L = Math.hypot(x, y); return L > 1 ? [x / L, y / L] : [x, y]; },   // diagonal never faster than cardinal
  consumeAction() { const p = this.actionPressed && !this._actionLatch; this._actionLatch = this.actionPressed; return p; },
};
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (window.Gather && Gather.UI.key(k)) { e.preventDefault(); return; } Input.keys[k] = true; if (k === 'e' || k === 'enter') Input.actionPressed = true; if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault(); });
addEventListener('keyup', e => { const k = e.key.toLowerCase(); Input.keys[k] = false; if (k === 'e' || k === 'enter') Input.actionPressed = false; });

// ---------------------------------------------------------------- Player (movement only; mirrors godot/play/Player.gd)
const Player = {
  cfg: { speed: 64, accel: 520, decel: 760, footW: 8, footH: 4, walkFps: 8, idleFps: 1.5 },
  x: 300, y: 318, vx: 0, vy: 0, facing: 'down', flip: false, moving: false, animT: 0,
  init() { const s = DATA.play.spawn; this.x = s[0]; this.y = s[1]; },
  blocked(x, y) { const col = DATA.col, W = DATA.play.width, H = DATA.play.height; const hw = this.cfg.footW / 2, hh = this.cfg.footH / 2;
    for (let yy = Math.round(y - hh); yy < Math.round(y + hh); yy++) for (let xx = Math.round(x - hw); xx < Math.round(x + hw); xx++) {
      if (xx < 0 || yy < 0 || xx >= W || yy >= H) return true; if (col[yy * W + xx]) return true; } return false; },
  step(dt, axis) {                                   // fixed-step; called 60x per second
    const [ix, iy] = axis; const c = this.cfg;
    const tx = ix * c.speed, ty = iy * c.speed;
    const a = (ix || iy) ? c.accel : c.decel;
    this.vx += Math.max(-a * dt, Math.min(a * dt, tx - this.vx)); this.vy += Math.max(-a * dt, Math.min(a * dt, ty - this.vy));
    if (!ix && Math.abs(this.vx) < 2) this.vx = 0; if (!iy && Math.abs(this.vy) < 2) this.vy = 0;
    // move axis by axis, sliding along obstacles; nudge around corners when the other axis is free
    const mv = (dx, dy) => { const nx = this.x + dx, ny = this.y + dy; if (!this.blocked(nx, ny)) { this.x = nx; this.y = ny; return true; } return false; };
    if (this.vx) { if (!mv(this.vx * dt, 0)) { if (!(this.vy) && !mv(this.vx * dt, 1) ) mv(this.vx * dt, -1); if (this.blocked(this.x + Math.sign(this.vx), this.y)) this.vx = 0; } }
    if (this.vy) { if (!mv(0, this.vy * dt)) { if (!(this.vx) && !mv(1, this.vy * dt)) mv(-1, this.vy * dt); if (this.blocked(this.x, this.y + Math.sign(this.vy))) this.vy = 0; } }
    this.moving = !!(ix || iy);
    if (this.moving) { if (Math.abs(ix) >= Math.abs(iy) * 0.9 && ix) { this.facing = 'side'; this.flip = ix < 0; } else this.facing = iy < 0 ? 'up' : 'down'; }
    this.animT += dt * (this.moving ? c.walkFps : c.idleFps);
  },
  frame() { const a = Survival.Activities.current; if (a && a.anim) return Math.floor(a.t * 6) % 4; const n = this.moving ? 2 + (Math.floor(this.animT) % 4) : (Math.floor(this.animT) % 2); return n; },
  setPos(x, y) { this.x = x; this.y = y; this.vx = this.vy = 0; },
};
// ---------------------------------------------------------------- Camera (follows the player, clamps to the playable world, integer pixels)
const Camera = { x: 0, y: 0, smooth: 8, deadzone: 0.25, vw: 640, vh: 360, init: false, safe: 0,
  update(dt) { const pl = DATA.play.playable; const tx = Player.x - this.vw / 2, ty = Player.y - 10 - this.vh / 2;
    const minx = pl[0] - 32, miny = pl[1] - 32, maxx = Math.max(0, pl[0] + pl[2] + 32 - this.vw), maxy = Math.max(0, pl[1] + pl[3] + 32 - this.vh);
    const cx = Math.max(Math.min(minx, maxx), Math.min(maxx, tx)), cy = Math.max(Math.min(miny, maxy), Math.min(maxy, ty));
    if (!this.init) { this.x = cx; this.y = cy; this.init = true; return; }
    const k = 1 - Math.exp(-this.smooth * dt);
    if (Math.abs(cx - this.x) > this.deadzone) this.x += (cx - this.x) * k; if (Math.abs(cy - this.y) > this.deadzone) this.y += (cy - this.y) * k;
    this.x = Math.max(0, Math.min(Math.max(0, W - this.vw), this.x)); this.y = Math.max(0, Math.min(Math.max(0, H - this.vh), this.y)); },
  ix() { return Math.round(this.x); }, iy() { return Math.round(this.y); } };
// ---------------------------------------------------------------- Interaction (objects carry their own prompt; the player only asks "what is near?")
const Interaction = { current: null, message: null, msgT: 0,
  update(dt) { let best = null, bd = 1e9; for (const it of DATA.play.interactables) { const d = Math.hypot(it.x - Player.x, it.y - Player.y); if (d < it.r && d < bd) { best = it; bd = d; } }
    const node = Gather.Nodes.nearest(Player.x, Player.y); if (node && (!best || Math.hypot(node.def.x - Player.x, node.def.y - Player.y) <= bd)) best = { id: 'node:' + node.def.id, label: node.def.label + (Gather.Tools.bestFor(node.def.tool) ? '' : ' (needs ' + node.def.tool + ')'), node, x: node.def.x, y: node.def.y, r: node.def.r };
    this.current = best; if (this.msgT > 0) this.msgT -= dt; else this.message = null;
